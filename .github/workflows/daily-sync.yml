name: 每日同步 README

on:
  schedule:
    # UTC 16:30 = 北京时间每天 00:30
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 生成 README
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: node scripts/build-readme.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "没有可提交的变化"
          else
            git commit -m "sync: 更新 README $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
